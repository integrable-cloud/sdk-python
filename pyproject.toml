[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integrable-cloud"
version = "0.1.0"
description = "Official Python SDK for the Integrable Cloud API - website chat assistants, conversations, knowledge bases and analytics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Integrable Cloud" }]
keywords = ["integrable", "chatbot", "ai", "customer-support", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# httpx rather than requests: one library that serves both the sync and the
# async client from the same connection-pooling code, so the two cannot drift
# in their retry or timeout behaviour. requests has no async story at all, and
# maintaining aiohttp alongside it would mean two of everything.
dependencies = ["httpx>=0.27,<0.29"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://integrable.cloud/docs"
Documentation = "https://integrable.cloud/docs/api"
Repository = "https://github.com/integrable-cloud/sdk-python"
Issues = "https://github.com/integrable-cloud/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/integrable_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
